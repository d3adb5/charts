apiVersion: v1
kind: Service
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "qbittorrent.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qbittorrent.fullname" . }}-peer
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
  {{- with .Values.peerService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.peerService.type }}
  {{- with .Values.peerService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.peerService.port }}
      targetPort: peer-tcp
      protocol: TCP
      name: peer-tcp
      {{- with .Values.peerService.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    - port: {{ .Values.peerService.port }}
      targetPort: peer-udp
      protocol: UDP
      name: peer-udp
      {{- with .Values.peerService.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "qbittorrent.selectorLabels" . | nindent 4 }}
