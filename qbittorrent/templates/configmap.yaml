{{- if .Values.qbittorrent.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qbittorrent.fullname" . }}-init
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
data:
  apply-config.sh: |
    #!/usr/bin/with-contenv bash
    set -euo pipefail

    conf=/config/qBittorrent/qBittorrent.conf

    set_key() {
      local tmp
      tmp="$(mktemp)"
      S="$1" K="$2" V="$3" awk '
        BEGIN { s = "[" ENVIRON["S"] "]"; p = ENVIRON["K"] "="; kv = p ENVIRON["V"] }
        /^\[/ { if (insec && !done) { print kv; done = 1 } insec = ($0 == s) }
        insec && index($0, p) == 1 { if (!done) { print kv; done = 1 } next }
        { print }
        END { if (!done) { if (!insec) print s; print kv } }
      ' "$conf" > "$tmp"
      cat "$tmp" > "$conf"
      rm -f "$tmp"
    }

    {{- range $section, $keys := .Values.qbittorrent.config }}
    {{- range $key, $value := $keys }}
    set_key {{ include "qbittorrent.shellQuote" $section }} {{ include "qbittorrent.shellQuote" $key }} {{ include "qbittorrent.shellQuote" $value }}
    {{- end }}
    {{- end }}
{{- end }}
