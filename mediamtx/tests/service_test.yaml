suite: Service

templates:
  - service.yaml

tests:
  - it: defaults to a LoadBalancer carrying the raw UDP listeners
    release:
      name: mediamtx
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.ports
          value:
            - name: srt
              port: 8890
              targetPort: srt
              protocol: UDP
            - name: webrtc-ice
              port: 8189
              targetPort: webrtc-ice
              protocol: UDP

  - it: is not rendered at all when nothing is exposed
    release:
      name: mediamtx
    set:
      protocols:
        srt:
          expose: false
        webrtc:
          expose: false
    asserts:
      - hasDocuments:
          count: 0

  - it: carries a port only when the protocol is enabled and exposed
    release:
      name: mediamtx
    set:
      protocols:
        srt: {enabled: true, port: 8890, expose: true}
        rtsp: {enabled: true, port: 8554, expose: false}
        rtmp: {enabled: false, expose: true}
        webrtc: {enabled: false}
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: srt
              port: 8890
              targetPort: srt
              protocol: UDP

  - it: never carries HTTP-based ports
    release:
      name: mediamtx
    set:
      protocols:
        hls: {enabled: true}
        playback: {enabled: true}
        pprof: {enabled: true}
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: hls
      - notContains:
          path: spec.ports
          content:
            name: webrtc
      - notContains:
          path: spec.ports
          content:
            name: api
      - notContains:
          path: spec.ports
          content:
            name: metrics
      - notContains:
          path: spec.ports
          content:
            name: playback
      - notContains:
          path: spec.ports
          content:
            name: pprof

  - it: can be switched to ClusterIP for in-cluster-only access
    release:
      name: mediamtx
    set:
      service:
        type: ClusterIP
        externalTrafficPolicy: ""
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - isNull:
          path: spec.externalTrafficPolicy

  - it: passes through annotations, for MetalLB address pinning
    release:
      name: mediamtx
    set:
      service:
        annotations:
          metallb.io/loadBalancerIPs: "192.168.1.40"
    asserts:
      - equal:
          path: metadata.annotations["metallb.io/loadBalancerIPs"]
          value: "192.168.1.40"
