suite: StatefulSet

templates:
  - statefulset.yaml

tests:
  - it: exposes container ports for enabled protocols only
    release:
      name: mediamtx
    set:
      protocols:
        rtsp: {enabled: true, port: 8554}
        hls: {enabled: true, port: 8888}
        rtmp: {enabled: false}
        srt: {enabled: false}
        webrtc: {enabled: false}
        api: {enabled: false}
        metrics: {enabled: false}
      livenessProbe:
        tcpSocket:
          port: rtsp
      readinessProbe:
        tcpSocket:
          port: rtsp
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: hls
              containerPort: 8888
              protocol: TCP

  - it: adds the RTP/RTCP pair only when RTSP uses a UDP transport
    release:
      name: mediamtx
    set:
      protocols:
        rtsp: {enabled: true, port: 8554, rtpPort: 8000, rtcpPort: 8001}
        srt: {enabled: false}
        webrtc: {enabled: false}
        api: {enabled: false}
        metrics: {enabled: false}
      mtxConfig:
        rtspTransports: [tcp, udp]
      livenessProbe:
        tcpSocket:
          port: rtsp
      readinessProbe:
        tcpSocket:
          port: rtsp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: rtp
            containerPort: 8000
            protocol: UDP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: rtcp
            containerPort: 8001
            protocol: UDP

  - it: omits the RTP/RTCP pair for the default TCP-only transport
    release:
      name: mediamtx
    set:
      protocols:
        rtsp: {enabled: true, port: 8554}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: rtp
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: rtcp

  - it: omits the webrtc-ice port when no ICE port is configured
    release:
      name: mediamtx
    set:
      protocols:
        webrtc: {enabled: true, port: 8889, icePort: null}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: webrtc-ice

  - it: serves MoQ over both TCP and UDP on one port when enabled
    release:
      name: mediamtx
    set:
      protocols:
        moq: {enabled: true, port: 8892}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: moq-h2
            containerPort: 8892
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: moq-h3
            containerPort: 8892
            protocol: UDP

  - it: injects each user password from the auth Secret, indexed in order
    release:
      name: mediamtx
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MTX_AUTHINTERNALUSERS_0_PASS
              valueFrom:
                secretKeyRef:
                  name: mediamtx-auth
                  key: publisher
            - name: MTX_AUTHINTERNALUSERS_1_PASS
              valueFrom:
                secretKeyRef:
                  name: mediamtx-auth
                  key: reader
            - name: MTX_AUTHINTERNALUSERS_2_PASS
              valueFrom:
                secretKeyRef:
                  name: mediamtx-auth
                  key: admin

  - it: reads passwords from an existing Secret when one is named
    release:
      name: mediamtx
    set:
      auth:
        existingSecret: my-creds
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-creds

  - it: mounts an emptyDir for recordings by default
    release:
      name: mediamtx
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: recordings
            emptyDir: {}

  - it: uses a volumeClaimTemplate for recordings when persistence is enabled
    release:
      name: mediamtx
    set:
      persistence:
        enabled: true
        size: 5Gi
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: recordings
            emptyDir: {}
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: recordings
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi

  - it: sets hostNetwork and dnsPolicy when enabled
    release:
      name: mediamtx
    set:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet

  - it: does not set hostNetwork by default
    release:
      name: mediamtx
    asserts:
      - isNull:
          path: spec.template.spec.hostNetwork

  - it: grabs environment variables from a sealed secret when given
    release:
      name: mediamtx
    set:
      secretEnv:
        sealed:
          MTX_PATHS_LAPTOP_SRTPUBLISHPASSPHRASE: "example_value"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: mediamtx-env

  - it: grabs environment variables from an existing secret when given
    release:
      name: mediamtx
    set:
      secretEnv:
        existingSecret: "example-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: example-secret

  - it: appends the image variant suffix to the tag
    release:
      name: mediamtx
    set:
      image:
        variant: ffmpeg
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '-ffmpeg$'

  - it: refuses a probe pointing at a port no enabled protocol provides
    release:
      name: mediamtx
    set:
      protocols:
        api:
          enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'probe references port "api", which no enabled protocol provides'
