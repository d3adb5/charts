suite: Auth Secret

templates:
  - secret-auth.yaml
  - sealed-secret-auth.yaml

tests:
  - it: generates a password per user when nothing else is provided
    release:
      name: mediamtx
    template: secret-auth.yaml
    asserts:
      - equal:
          path: metadata.name
          value: mediamtx-auth
      - isNotNull:
          path: data.publisher
      - isNotNull:
          path: data.reader
      - isNotNull:
          path: data.admin
      # Survives a helm uninstall so credentials are not silently rotated.
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: generates passwords of the requested length
    release:
      name: mediamtx
    template: secret-auth.yaml
    set:
      auth:
        passwordLength: 40
        users:
          - name: solo
            permissions: [publish]
    asserts:
      - matchRegex:
          path: data.solo
          # 40 raw chars -> 56 base64 chars including padding
          pattern: '^.{56}$'

  - it: generates nothing when an existing Secret is named
    release:
      name: mediamtx
    template: secret-auth.yaml
    set:
      auth:
        existingSecret: my-creds
    asserts:
      - hasDocuments:
          count: 0

  - it: generates nothing when sealed passwords are given
    release:
      name: mediamtx
    template: secret-auth.yaml
    set:
      auth:
        sealed:
          publisher: "AgAAencrypted"
          reader: "AgAAencrypted"
          admin: "AgAAencrypted"
    asserts:
      - hasDocuments:
          count: 0

  - it: writes a SealedSecret from the encrypted passwords
    release:
      name: mediamtx
    template: sealed-secret-auth.yaml
    set:
      auth:
        sealed:
          publisher: "AgAAencrypted"
          reader: "AgAAencrypted"
          admin: "AgAAencrypted"
    asserts:
      - isKind:
          of: SealedSecret
      - equal:
          path: metadata.name
          value: mediamtx-auth
      - equal:
          path: spec.encryptedData.publisher
          value: "AgAAencrypted"

  - it: joins a multi-line sealed value into one whitespace-free string
    release:
      name: mediamtx
    template: sealed-secret-auth.yaml
    set:
      auth:
        users:
          - name: solo
            permissions: [publish]
        sealed:
          solo: |
            AgBv1zXhFirstLine
            SecondLineHere
            ThirdLineHere
    asserts:
      - equal:
          path: spec.encryptedData.solo
          value: "AgBv1zXhFirstLineSecondLineHereThirdLineHere"

  - it: strips stray indentation and tabs from sealed values too
    release:
      name: mediamtx
    template: sealed-secret-auth.yaml
    set:
      auth:
        users:
          - name: solo
            permissions: [publish]
        sealed:
          solo: "AgBv1zXh  \t\n  SecondLine \n ThirdLine"
    asserts:
      - equal:
          path: spec.encryptedData.solo
          value: "AgBv1zXhSecondLineThirdLine"

  - it: refuses both an existing Secret and sealed passwords
    release:
      name: mediamtx
    template: secret-auth.yaml
    set:
      auth:
        existingSecret: my-creds
        sealed:
          publisher: "AgAAencrypted"
    asserts:
      - failedTemplate:
          errorPattern: 'mutually exclusive'

  - it: refuses sealed passwords that do not cover every user
    release:
      name: mediamtx
    template: secret-auth.yaml
    set:
      auth:
        sealed:
          publisher: "AgAAencrypted"
    asserts:
      - failedTemplate:
          errorPattern: 'auth.sealed has no encrypted password for user "reader"'
