suite: Ingress

templates:
  - ingress.yaml

tests:
  - it: is not rendered by default
    release:
      name: mediamtx
    asserts:
      - hasDocuments:
          count: 0

  - it: routes / to webrtc signalling on the http Service by default
    release:
      name: mediamtx
    set:
      ingress:
        enabled: true
        host: example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: mediamtx-http
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8889

  - it: carries several prefixes to different listeners on one host
    release:
      name: mediamtx
    set:
      ingress:
        enabled: true
        host: example.com
        routes:
          - path: /v3
            portName: api
          - path: /
            portName: webrtc
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /v3
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9997
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 8889

  - it: defaults each route to a Prefix match
    release:
      name: mediamtx
    set:
      ingress:
        enabled: true
        host: example.com
        routes:
          - path: /v3
            portName: api
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: follows a port number changed under protocols
    release:
      name: mediamtx
    set:
      protocols:
        hls:
          enabled: true
          port: 18888
      ingress:
        enabled: true
        host: example.com
        routes:
          - path: /
            portName: hls
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 18888

  - it: fails for a raw protocol that cannot be routed by an Ingress
    release:
      name: mediamtx
    set:
      protocols:
        srt:
          enabled: true
      ingress:
        enabled: true
        host: example.com
        routes:
          - path: /
            portName: srt
    asserts:
      - failedTemplate:
          errorPattern: 'names port "srt", which is not an enabled HTTP protocol'

  - it: fails when the targeted HTTP protocol is disabled
    release:
      name: mediamtx
    set:
      protocols:
        api:
          enabled: false
      ingress:
        enabled: true
        host: example.com
        routes:
          - path: /v3
            portName: api
      livenessProbe:
        tcpSocket:
          port: webrtc
      readinessProbe:
        tcpSocket:
          port: webrtc
    asserts:
      - failedTemplate:
          errorPattern: 'names port "api", which is not an enabled HTTP protocol'

  - it: terminates TLS when enabled
    release:
      name: mediamtx
    set:
      ingress:
        enabled: true
        host: example.com
        tls:
          enabled: true
          secretName: example-com-tls
    asserts:
      - equal:
          path: spec.tls[0].hosts[0]
          value: example.com
      - equal:
          path: spec.tls[0].secretName
          value: example-com-tls
