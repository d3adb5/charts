{{- include "mediamtx.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mediamtx.fullname" . }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mediamtx.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mediamtx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /*
          Passwords are deliberately left out of this checksum: they are read
          from a Secret at startup, and hashing generated ones would roll the
          pod on every render.
        */}}
        checksum/config: {{ printf "%s%s" (include "mediamtx.config" .) (ternary (include "mediamtx.gateConfig" .) "" .Values.gate.enabled) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mediamtx.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "mediamtx.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $internalUsers := and .Values.auth.users (not .Values.gate.enabled) }}
          {{- if or $internalUsers .Values.env }}
          env:
            {{- /*
              MediaMTX overrides list entries by index, so the order here has
              to match the order authInternalUsers is generated in.
            */}}
            {{- if $internalUsers }}
            {{- range $index, $user := .Values.auth.users }}
            - name: MTX_AUTHINTERNALUSERS_{{ $index }}_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mediamtx.authSecretName" $ }}
                  key: {{ $user.name }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.secretEnv.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretEnv.existingSecret }}
          {{- else if .Values.secretEnv.sealed }}
          envFrom:
            - secretRef:
                name: {{ include "mediamtx.fullname" . }}-env
          {{- end }}
          ports:
            {{- range include "mediamtx.ports" . | fromYamlArray }}
            {{- if ne (.container | default "mediamtx") "gate" }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: recordings
              mountPath: /recordings
            {{- if .Values.serverTLS.secretName }}
            {{- /*
              A directory, never subPath: subPath is a copy taken at start and
              never sees a renewal, and MediaMTX reloads the files itself.
            */}}
            - name: server-tls
              mountPath: {{ include "mediamtx.serverTLSDir" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.gate }}
        {{- if .enabled }}
        - name: gate
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          args:
            - -config=/etc/mtx-gate/config.json
            {{- if .enforce }}
            - -enforce
            {{- end }}
          ports:
            {{- range include "mediamtx.ports" $ | fromYamlArray }}
            {{- if eq (.container | default "mediamtx") "gate" }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: gate
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mtx-gate/config.json
              subPath: gate.json
              readOnly: true
            - name: gate-passwords
              mountPath: /etc/mtx-gate/passwords
              readOnly: true
        {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mediamtx.fullname" . }}
        {{- if .Values.gate.enabled }}
        - name: gate-passwords
          secret:
            secretName: {{ include "mediamtx.authSecretName" . }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: recordings
          emptyDir: {}
        {{- end }}
        {{- with .Values.serverTLS.secretName }}
        - name: server-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: recordings
      spec:
        accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- with .Values.extraVolumeClaimTemplates }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
