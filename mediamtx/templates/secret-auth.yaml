{{- include "mediamtx.validate" . }}
{{- if and (not .Values.auth.existingSecret) (not .Values.auth.sealed) }}
{{- $name := printf "%s-auth" (include "mediamtx.fullname" .) }}
{{- /*
  Reuse whatever is already in the cluster so that helm upgrade does not
  invalidate working credentials. Renderers without cluster access get nil
  here and will produce fresh passwords instead.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $current := dict }}
{{- if $existing }}
{{- $current = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range .Values.auth.users }}
  {{ .name }}: {{ get $current .name | default (randAlphaNum (int $.Values.auth.passwordLength) | b64enc) | quote }}
  {{- end }}
{{- end }}
