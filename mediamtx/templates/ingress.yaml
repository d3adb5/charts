{{- if .Values.ingress.enabled -}}
{{- $ports := include "mediamtx.httpPorts" . | fromYamlArray }}
{{- $byName := dict }}
{{- $names := list }}
{{- range $ports }}
{{- $_ := set $byName .name .port }}
{{- $names = append $names .name }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mediamtx.fullname" . }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ quote .Values.ingress.host }}
      http:
        paths:
          {{- range .Values.ingress.routes }}
          {{- if not (hasKey $byName .portName) }}
          {{- fail (printf "ingress route %q names port %q, which is not an enabled HTTP protocol (available: %s)" .path .portName (join ", " $names)) }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "mediamtx.fullname" $ }}-http
                port:
                  number: {{ get $byName .portName }}
          {{- end }}
{{- end }}
