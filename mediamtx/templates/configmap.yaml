{{- include "mediamtx.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mediamtx.fullname" . }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
data:
  mediamtx.yml: |
    {{- include "mediamtx.config" . | nindent 4 }}
  {{- if .Values.gate.enabled }}
  gate.json: |
    {{- include "mediamtx.gateConfig" . | nindent 4 }}
  {{- end }}
